<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="profile.css">
    <title>Profile Card</title>
</head>
<body>
    <div class="main_box">
            <div class="header">
                <div class="profile_pic">
                <img src="project1_pics/HOME.jpeg">
                </div>
            </div>
            <div class="name_container">
                <div class="name">CodingLab</div>
                <div class="work">YouTuber & Blogger</div>
            </div>

            <div class="icons_container">
                <div class="facebook">
                    <img src="project1_pics/facebook-logo.svg">
                </div>
                <div class="github">
                    <img src="project1_pics/github-logo.svg">
                </div>
                <div class="linkedin">
                    <img src="project1_pics/linkedin-logo.svg">
                </div>
                <div class="twitter">
                    <img src="project1_pics/twitter-logo.svg">
                </div>
            </div>
            
            <div class="button_container">
                <button class="button_style">Subscribe</button>
                <button class="button_style">Messages</button>
            </div>

            <div class="tap_container">
                <div class="like">
                <img class="like_img" src="project1_pics/heart.svg">60k
                </div>
                <div class="comment">
                <img src="project1_pics/comment.svg">20k
                </div>
                <div class="share">
                <img src="project1_pics/share.svg">12k
                </div>
            </div>
    </div>
</body>
</html>
